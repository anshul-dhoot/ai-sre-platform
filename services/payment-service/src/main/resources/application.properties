logging.structured.format.console=logstash
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=payment-service
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties[spring.deserializer.value.delegate.class]=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties[spring.json.value.default.type]=com.aisre.platform.paymentservice.OrderCreated
spring.kafka.consumer.properties[spring.json.trusted.packages]=com.aisre.platform.paymentservice
spring.kafka.consumer.properties[spring.json.use.type.headers]=false
spring.kafka.listener.ack-mode=record
spring.kafka.listener.concurrency=1
payment.kafka.topic=orders.events
payment.processing.max-attempts=3
payment.processing.retry-delay=250ms
